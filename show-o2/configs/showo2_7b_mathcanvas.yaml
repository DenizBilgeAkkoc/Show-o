wandb:
  entity: null
  resume: 'auto'

# MathCanvas training config for Show-o2 7B with Qwen2.5-7B backbone

experiment:
    project: "showo2-mathcanvas"
    name: "showo2-7b-mathcanvas-lora"
    output_dir: "showo2-7b-mathcanvas-lora"
    output_dataloader_state_dir: null
    max_train_examples_t2i: 60000000
    max_train_examples_mmu: null
    save_every: 10000
    generate_every: 5000
    log_every: 50
    log_grad_norm_every: 500
    resume_from_checkpoint: 'latest'

model:
    vae_model:
        type: "wan21"
        pretrained_model_path: "Wan2.1_VAE.pth"

    showo:
        model_name: "Showo2"
        load_from_showo: True
        pretrained_model_path: "showlab/show-o2-7B"  # 7B model
        llm_model_path: "Qwen/Qwen2.5-7B-Instruct"   # 7B backbone
        llm_vocab_size: null
        hidden_size: 3584  # 7B hidden size (larger than 1.5B's 1536)
        image_latent_dim: 16
        image_latent_height: 27  # Match SigLIP position embeddings
        image_latent_width: 27
        hq_image_latent_height: 64
        hq_image_latent_width: 64
        mixed_modal_latent_height: 27
        mixed_modal_latent_width: 27
        patch_size: 2
        num_diffusion_layers: 10
        clip_latent_dim: 1152
        add_qk_norm: True
        add_time_embeds: True
        frozen_params: null  # With LoRA: keep embedders/projectors trainable
        params_not_load: null
        # LoRA configuration - optimized for 7B model
        lora:
            enabled: True
            r: 32               # Higher rank for 7B model
            alpha: 64           # 2x rank is common
            dropout: 0.05
            target_modules: null # default: q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj

    clip:
        pretrained_model_path: "google/siglip-so400m-patch14-384"

    gradient_checkpointing: True

dataset:
    samp_probs: null
    accumulation: 1
    mixed_loader_mode: "sequential_max_size_cycle"
    
    # MathCanvas specific parameters
    mathcanvas:
        parquet_path: "/path/to/MathCanvas-Instruct/all_data.parquet"
        use_iterable: False
        include_question_images: True
        include_solution_images: True
    
    params:
        train_mixed_modal_shards_path_or_url: null
        annotation_path: null
        is_clip_encoder: False
        default_system_prompt: ""
        add_caption_prompt: True
        validation_prompts_file: "prompts/t2i_prompts.txt"
        shuffle_buffer_size: 1000
        num_workers: 8  # More workers for larger dataset
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 1280
        max_hq_seq_length: 5120
        max_mixed_modal_seq_length: 4096  # Slightly reduced for memory
        resolution: 432  # Match 27*16 VAE latent
        mixed_modal_resolution: 432
        hq_resolution: 1024
        num_t2i_image_tokens: 729  # 27x27 (match SigLIP)
        num_mmu_image_tokens: 729
        num_hq_image_tokens: 4096
        num_mixed_modal_tokens: 729
        num_video_tokens: 5120
        latent_height: ${model.showo.image_latent_height}
        latent_width: ${model.showo.image_latent_width}
        hq_latent_height: ${model.showo.hq_image_latent_height}
        hq_latent_width: ${model.showo.hq_image_latent_width}
        mixed_modal_latent_height: ${model.showo.mixed_modal_latent_height}
        mixed_modal_latent_width: ${model.showo.mixed_modal_latent_width}
        min_res: [ 256, 256 ]
        random_und_or_gen: 0.0
        max_num_images: 4

optimizer:
    name: adamw
    params:
        learning_rate: 0.00005  # Lower LR for larger model
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.01  # Small weight decay
        epsilon: 1e-8

lr_scheduler:
    scheduler: "constant_with_warmup"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 1000  # More warmup for larger model

transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 5.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

training:
    gradient_accumulation_steps: 8
    batch_size: 1
    batch_size_mmu: 1
    batch_size_mixed_modal: 1  # 1 per GPU, effective = 1 * 2 GPUs * 8 accum = 16
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 42
    max_train_steps: 82000  # ~3 epochs for 218K samples
    cond_dropout_prob: 0.1
    label_smoothing: 0.0
    max_grad_norm: 1.0
    ntp_coeff: 0.2
    flow_coeff: 1.0
    und_max_t0: 1.0
